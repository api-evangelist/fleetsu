      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                email:
                  type: string
                userId:
                  type: string
                driverToken:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                accountId: '1'
                active: 2
                roleId: driver
                driverToken: GB1
                email: ''
                userId: 1
                driverId: 1
