                  firstName: ''
                  lastName: ''
                  avatar: ''
                  dateCreated: '0000-00-00T00:00:00+00:00'
                  fbtActive: false
                  dashboard: default
                  landingPage: fleetmap
                  isAccountHolder: false
                  driverToken: gd1
                  authMethod: local
                  tags:
                  - tagId: '1'
                    accountId: 1
                    tagName: '1'
                    tagBgColor: '1'
                    status: true
                    dateCreated: '0000-00-00T00:00:00+00:00'
                    tagType: TRACKER
