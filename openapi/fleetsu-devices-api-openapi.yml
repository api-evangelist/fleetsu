    get:
      operationId: getV1DevicesManufacturers
      summary: devices/manufacturers
      tags:
      - Devices
      description: List of Device Health Status
      responses:
        default:
          description: Response not documented in the collection
    post:
      operationId: postV1DevicesManufacturers
      summary: devices/manufacturers
      tags:
