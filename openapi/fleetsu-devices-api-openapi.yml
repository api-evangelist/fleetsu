openapi: 3.2.0
info:
  title: Fleetsu Devices API
  version: 1.0.0
  description: 'Platform API Documentation


    The Fleetsu API is organised around REST. Our REST URls return JSON-encoded responses. Standard HTTP Response codes are returned on all requests.

    Ensure a Header Value Key = "Accept" Value = "application/json"


    All API Requests must be made over HTTPS


    Authentication


    The Fleetsu API uses HTTP Basic Authentication use your Fleetsu username and password to authenticate.


    Unauthenticated requests will fail with a 401 Unauthorized HTTP Response


    Basic Authentication


    Using standard basic http authentication headers,using a user''s login credentials e.g.


    Authorization: Basic OgXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX==


    Filtering/Searching


    String Fields


    Examples


    ?label=Asset123 Specific Search


    ?label=Asset* Wildcard Search


    ?label=*123 Wildcard Search


    ?label=Asset123,Asset456 Multivalue OR search


    Integer,Float Fields


    Examples


    ?groupId=12 Specific Search


    ?groupId=12,76,100 Multivalue OR search


    ?groupId[0]=12&groupId[1]=76&groupId[2]=100 Multivalue OR search


    Datetime Fields


    Datetime fields can be searched using most common formats including relative, although it is recommended to use ISO 8601 standard dates.


    If a timezone is not specified in the date string UTC will be assumed.


    Examples


    ?datetime=>2017-01-01T00:00:00Z


    ?datetime=<2017-11-30T00:00:00+00:00


    ?datetime=>2017-11-14T00:00:00+08:00,<2017-11-17T23:59:59+08:00


    ?datetime=-7 day


    ?datetime=>last monday midnight,<today midnight


    Sorting


    _sort - Sort Results Set by specifed field e.g.


    _sort=label - Sort by label field in ascending order


    _sort=!label - Sort by label field in decending order


    _sort=make,model - Sort by Make and then Model in ascending order


    Pagination


    _limit - Limit returned results Min: 1, Max: 1000, default: 200


    _start - Start point for returning results e.g. _start=201


    Extending Datasets


    _extend - Append related data to the search results e.g.


    _extend=event - Single Extend


    _extend=event,account - Multiple Extends


    Basic Extend


    The returned fields in the extended objects can also restricted to the fields you require e.g.


    _extend=event:eventId|latitude|longitude|heading|speed|datetime


    Advanced Extend


    _extend[event][_fields]=eventId|latitude|longitude|heading|speed|datetime


    _extend[event][datetime]=>2018-06-01,<2018-06-30


    _extend[event][code]=144


    _extend[event][_sort]=datetime


    Grouping


    _group - Group Results By Field e.g.


    _group=datetime:hour Group By Hour


    Available Datetime field modifiers


    HOUR - Hour of Day


    DATE - Day


    MONTH - Month


    DAYOFMONTH - Day of Month e.g. 1st of every month


    DAYOFWEEK - Day of the Week


    DAYOFYEAR - Day of Year 1 to 365


    MINUTE - Minute


    WEEK - Week of Year


    WEEKDAY


    WEEKOFYEAR


    YEAR


    YEARWEEK


    DATEHOUR'
servers:
- url: https://api.fleetsu.com
security:
- basicAuth: []
tags:
- name: Devices
paths:
  /v1/device/check/{deviceId}:
    get:
      operationId: getV1DeviceCheckByDeviceid
      summary: v1/device/check/{deviceId}
      tags:
      - Devices
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                deviceId: ''
                deviceState: ''
                networkState: ''
                platformState: ''
                gpsState: ''
                speedPulseState: ''
                platformLastActivity: '0000-00-00T00:00:00+00:00'
                gpsLastActivity: '0000-00-00T00:00:00+00:00'
  /v1/device/check/{deviceId}/{iccid}:
    get:
      operationId: getV1DeviceCheckByDeviceidByIccid
      summary: v1/device/check/{deviceId}/{iccid}
      tags:
      - Devices
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
      - name: iccid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                deviceId: 014869001721887
                deviceState: offline
                networkState: offline
                platformState: offline
                gpsState: offline
                speedPulseState: offline
                platformLastActivity: '2019-04-30T09:05:42+00:00'
                gpsLastActivity: '2019-04-30T09:05:42+00:00'
  /v1/devices:
    get:
      operationId: getV1Devices
      summary: v1/devices
      tags:
      - Devices
      description: 'List of Tracker Devices


        Fields


        assetID,imei - (string) - Unique Asset ID


        label - (string) - Asset label


        jobId - (string) - External Job Reference No. (scheduled for v9.22)


        type - (string) - Asset Type


        vehicleRegitration - (string) - Vehicle Registration No


        vehicleMake - (string) - Vehicle Manufacturer


        vehicleModel - (string) - Vehicle Model


        vehicleVin - (string) - Vechicle VIN Number


        avatar - (string) - URL to Asset Avatar


        mapIconId - (int) - Map Icon Id


        groupId - (int) - Assigned Asset Group


        accountID,customerId - (int) - Asset Account


        dateInstalled - (datetime) - Date Tracker Device Installed


        Custom Query Parameters


        q - (string) - Search assetId,imei,label,vehicleRegistration


        tagId - (string) - Related Tag


        deviceHealthId - (string) - Device Health ID


        assetStateId - (string) - Asset State ID


        Modifier Query Parameters


        _fields : Avaliable Fields


        assetId,imei


        label


        jobId


        type


        vehicleRegitration


        vehicleMake


        vehicleModel


        vehicleVin


        avatar


        mapIconId


        groupId


        accountId,customerId


        dateInstalled


        _extend : Available Extentions


        event - Last Event last valid location received


        ping - Last Ping last time device communicated with platform


        movement - Last Movement last time asset moved


        account - Account assocated account


        group - Group associated asset group


        asset/odo - ODO Reading current odometer reading


        asset/tags - Tags associated tags


        asset/state - Asset State moving, parked, towing, review,investigate


        asset/setting - Custom Setting custom asset settings e.g. fuel type


        asset/reminders - Service Reminders pending service reminders


        _sort : Available sort fields


        imei


        label


        vehicleRegistration


        vehicleMake


        vehicleModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                total: 29
                start: 1
                end: 1
                results:
                - deviceId: '123456789012345678'
                  imei: '123456789012345678'
                  phoneNo: ''
                  enabled: 0
                  label: Asset 1
                  customerId: 0
                  userId: 0
                  groupId: 0
                  avatar: ''
                  simSerial: ''
                  authcode: null
                  vehicleMake: ''
                  vehicleModel: ''
                  vehicleRegistration: ''
                  vehicleVin: ''
                  maker: ''
                  model: ''
                  dateProvisioned: '0000-00-00T00:00:00+00:00'
                  fbtEnabled: true
                  reminderUserId: null
                  battery: ''
                  mapIconId: 14
                  allowApiEvents: false
                  driverId: null
                params:
                  customerId: 4
                  groupId: []
