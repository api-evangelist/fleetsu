      description: List of Device Health Status
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                deviceManufacturer:
                  type: string
                description:
                  type: string
                sortOrder:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                deviceManufacturer: ford12-transit
                deviceManufacturerId: ford12-transit
                status: true
                description: 'for12 transit '
                sortOrder: 1
