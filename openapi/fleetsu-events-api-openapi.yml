openapi: 3.2.0
info:
  title: Fleetsu Events API
  version: 1.0.0
  description: 'Platform API Documentation


    The Fleetsu API is organised around REST. Our REST URls return JSON-encoded responses. Standard HTTP Response codes are returned on all requests.

    Ensure a Header Value Key = "Accept" Value = "application/json"


    All API Requests must be made over HTTPS


    Authentication


    The Fleetsu API uses HTTP Basic Authentication use your Fleetsu username and password to authenticate.


    Unauthenticated requests will fail with a 401 Unauthorized HTTP Response


    Basic Authentication


    Using standard basic http authentication headers,using a user''s login credentials e.g.


    Authorization: Basic OgXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX==


    Filtering/Searching


    String Fields


    Examples


    ?label=Asset123 Specific Search


    ?label=Asset* Wildcard Search


    ?label=*123 Wildcard Search


    ?label=Asset123,Asset456 Multivalue OR search


    Integer,Float Fields


    Examples


    ?groupId=12 Specific Search


    ?groupId=12,76,100 Multivalue OR search


    ?groupId[0]=12&groupId[1]=76&groupId[2]=100 Multivalue OR search


    Datetime Fields


    Datetime fields can be searched using most common formats including relative, although it is recommended to use ISO 8601 standard dates.


    If a timezone is not specified in the date string UTC will be assumed.


    Examples


    ?datetime=>2017-01-01T00:00:00Z


    ?datetime=<2017-11-30T00:00:00+00:00


    ?datetime=>2017-11-14T00:00:00+08:00,<2017-11-17T23:59:59+08:00


    ?datetime=-7 day


    ?datetime=>last monday midnight,<today midnight


    Sorting


    _sort - Sort Results Set by specifed field e.g.


    _sort=label - Sort by label field in ascending order


    _sort=!label - Sort by label field in decending order


    _sort=make,model - Sort by Make and then Model in ascending order


    Pagination


    _limit - Limit returned results Min: 1, Max: 1000, default: 200


    _start - Start point for returning results e.g. _start=201


    Extending Datasets


    _extend - Append related data to the search results e.g.


    _extend=event - Single Extend


    _extend=event,account - Multiple Extends


    Basic Extend


    The returned fields in the extended objects can also restricted to the fields you require e.g.


    _extend=event:eventId|latitude|longitude|heading|speed|datetime


    Advanced Extend


    _extend[event][_fields]=eventId|latitude|longitude|heading|speed|datetime


    _extend[event][datetime]=>2018-06-01,<2018-06-30


    _extend[event][code]=144


    _extend[event][_sort]=datetime


    Grouping


    _group - Group Results By Field e.g.


    _group=datetime:hour Group By Hour


    Available Datetime field modifiers


    HOUR - Hour of Day


    DATE - Day


    MONTH - Month


    DAYOFMONTH - Day of Month e.g. 1st of every month


    DAYOFWEEK - Day of the Week


    DAYOFYEAR - Day of Year 1 to 365


    MINUTE - Minute


    WEEK - Week of Year


    WEEKDAY


    WEEKOFYEAR


    YEAR


    YEARWEEK


    DATEHOUR'
servers:
- url: https://api.fleetsu.com
security:
- basicAuth: []
tags:
- name: Events
paths:
  /v1/events:
    get:
      operationId: getV1Events
      summary: v1/events
      tags:
      - Events
      description: 'List of Events


        Fields


        eventId - (int) - Event ID


        imei - (string) - Unique Asset ID


        label - (string) - Asset label


        latitude - (Float) - Asset location''s latitude


        longitude - (Float) - Asset location''s longitude


        formattedAddress - (String) - Asset location''s Full Address


        gpsIndicator - (String) - Device''s GPS Indicator


        numSatellites - (int) - Device''s total number of satellites


        heading - (int) - Device''s Heading


        speed - (int) - Asset Speed


        datetime - (datetime) - Event occurred Datetime


        Custom Query Parameters


        q - (string) - Search assetId,imei,label,vehicleRegistration


        imei - (string) - Device''s IMEI


        tagId - (string) - Related Tag


        customerId - (int) - Customer ID


        groupId - (int) - Group ID


        Modifier Query Parameters


        _fields : Avaliable Fields


        eventId


        imei


        label


        latitude


        longitude


        formattedAddress


        gpsIndicator


        numSatellite


        heading


        speed


        datetime


        _extend : Available Extentions


        event/address - Event''s full address


        device - Device Details


        event/extendedinfo - Event''s extended info details


        account - Account Details


        event/fence - Fence Details


        trip - Trip Details


        _sort : Available sort fields


        datetime


        imei'
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                results:
                - eventId: 1666111905
                  datetime: '2022-01-04T05:50:54+00:00'
                  code: '33'
                  latitude: -28.97719
                  longitude: 117.80396
                  numSatellites: 9
                  gsmSignal: 1
                  heading: 210
                  hdop: 0
                  altitude: 32767
                  speed: 98
                  processedDate: '2022-01-04T05:50:57+00:00'
                  imei: vt4662241316
                  batteryRemaining: 4.158
                  postProcessed: '2022-01-04T05:51:02+00:00'
                  engineHour: 256200823
                  deviceId: vt4662241316
                - eventId: 1666111286
                  datetime: '2022-01-04T05:50:14+00:00'
                  code: '33'
                  latitude: -29.55442
                  longitude: 117.15334
                  numSatellites: 9
                  gsmSignal: 1
                  heading: 214
                  hdop: 0
                  altitude: 31817
                  speed: 85
                  processedDate: '2022-01-04T05:50:15+00:00'
                  imei: vt4662351313
                  batteryRemaining: 4.144
                  postProcessed: '2022-01-04T05:50:22+00:00'
                  engineHour: 20077093
                  deviceId: vt4662351313
                - eventId: 1666111269
                  datetime: '2022-01-04T05:50:14+00:00'
                  code: '33'
                  latitude: -29.55442
                  longitude: 117.15334
                  numSatellites: 9
                  gsmSignal: 1
                  heading: 214
                  hdop: 0
                  altitude: 31817
                  speed: 85
                  processedDate: '2022-01-04T05:50:15+00:00'
                  imei: vt4662241316
                  batteryRemaining: 4.144
                  postProcessed: '2022-01-04T05:50:22+00:00'
                  engineHour: 246196693
                  deviceId: vt4662241316
                total: 2
    post:
      operationId: postV1Events
      summary: v1/events
      tags:
      - Events
      description: 'Create Event


        Error Codes:


        4001001: Missing Event Code


        4001002: Missing Datetime


        4001003: Missing Device ID


        4090001: Duplicate Message - Device ID + DateTime + Code


        4001004: Device Not Found'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                assetId:
                  type: string
                code:
                  type: string
                datetime:
                  type: string
      responses:
        default:
          description: Response not documented in the collection
  /v1/events/codes:
    get:
      operationId: getV1EventsCodes
      summary: v1/events/codes
      tags:
      - Events
      description: List of Event Codes & Descriptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                total: 1
                start: 1
                end: 1
                params: {}
                results:
                - code: ''
                  parameter: ''
                  extendedDescription: ''
                  type: INFO
                  purpose: ''
  /v1/events/history:
    get:
      operationId: getV1EventsHistory
      summary: v1/events/history
      tags:
      - Events
      description: List of Event Codes & Descriptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                total: 1
                start: 1
                end: 1
                results:
                - datetime: '2022-01-04 05:50:54'
                  total: 1
  /v1/events/important:
    get:
      operationId: getV1EventsImportant
      summary: v1/events/important
      tags:
      - Events
      description: 'List of Important Events


        See /events for searching and filtering options'
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                total: 999999
                start: 1
                end: 200
                results:
                - label: ''
                  eventId: 1660082453
                  datetime: '0000-00-00T00:00:00+00:00'
                  code: ''
                  heading: ''
                  imei: ''
                  tripId: 0
                  speed: 0
                  latitude: 0
                  longitude: 0
                  extendedDescription: Device Overheat
                  deviceId: ''
  /v1/events/parameters/types:
    get:
      operationId: getV1EventsParametersTypes
      summary: v1/events/parameters/types
      tags:
      - Events
      description: Load Event Details
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                latitude:
                  type: string
                streetNumber:
                  type: string
                streetName:
                  type: string
                suburb:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                total: 834
                start: 1
                end: 834
                results:
                - parameter: assetOdometer
                  description: Asset - Odometer
                  unit: km
                  parameterGroup: Asset
                - parameter: assetRuntime
                  description: Asset - Runtime
                  unit: hr
                  parameterGroup: Asset
                - parameter: assetSpeed
                  description: Asset - Speed
                  unit: km/h
                  parameterGroup: Asset
  /v1/events/total-fuel:
    get:
      operationId: getV1EventsTotalFuel
      summary: v1/events/total-fuel
      tags:
      - Events
      description: Total Fuel Consumption
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                total: 0
                private: 0
                business: 0
                unknown: 0
  /v1/events/{eventId}:
    get:
      operationId: getV1EventsByEventid
      summary: v1/events/{id}
      tags:
      - Events
      description: Load Event Details
      parameters:
