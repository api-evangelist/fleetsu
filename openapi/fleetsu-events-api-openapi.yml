                hdop: 0
                altitude: 0
                speed: 0
                processedDate: '2022-01-04T05:50:57+00:00'
                imei: ''
                batteryRemaining: 0
                postProcessed: '2022-01-04T05:51:02+00:00'
                engineHour: 0
                deviceId: ''
  /v1/events/{eventId}/address:
