    post:
      operationId: postV1UsersByUseridGroups
      summary: users/{userId}/groups
      tags:
      - Users
      description: List of Groups user is associated with
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                groupId:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                groupId: 3
                userId: 1
                status: true
                userGroupId: 5
  /v1/users/{userId}/groups/{groupId}:
