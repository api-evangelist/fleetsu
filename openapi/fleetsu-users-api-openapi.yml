          type: string
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                total: 1
                start: 1
                end: 1
                results:
                - userId: 1
                  email: ''
                  active: 0
                  roleId: ''
                  accountId: '0'
                  firstName: ''
                  lastName: ''
                  dateCreated: '0000-00-00T00:00:00+00:00'
                  fbtActive: false
                  dashboard: ''
                  landingPage: ''
                  isAccountHolder: true
                  authMethod: ''
    delete:
      operationId: deleteV1UsersByUseridGroupsByGroupid
      summary: v1/users/{userId}/groups/{groupId}
      tags:
