  /v1/tags/{tagId}/fences/{fenceId}:
    delete:
      operationId: deleteV1TagsByTagidFencesByFenceid
      summary: tags/{id}/fences/{fenceId}
      tags:
      - Tags
      description: Unlink Fence with Tag
      parameters:
      - name: tagId
        in: path
        required: true
