  /v1/reports/fleet/completed-trips:
    get:
      operationId: getV1ReportsFleetCompletedTrips
      summary: reports/fleet/completed-trips
      tags:
      - Reports
      description: '<p>Completed Trips Report</p>

        <p>###Fields</p>

        <ul>

        <li>tripId - <em>(string)</em> Unique Trip ID</li>

        <li>tripDistance - <em>(number)</em> Distance travelled in the trip (in Metres)</li>

        <li>dateFrom - <em>(datetime)</em> Trip start date and time</li>

        <li>dateTo - <em>(datetime)</em> Trip end date and time</li>

        <li>maxSpeed - <em>(number)</em> Maximum speed travelled during the trip</li>

        <li>avgSpeed - <em>(number)</em> Average speed travelled during the trip</li>

        <li>imei - <em>(string)</em> Unique asset identifier</li>

        <li>startEventId - <em>(string)</em> Identifier of the event from which the trip began</li>

        <li>endEventId - <em>(string)</em> Identifier of the event till which the trip lasted</li>

        <li>type - <em>(string)</em> Trips type</li>

        <li>fuelConsumed - <em>(number)</em> Amount of fuel consumed during the trip(in Millilitres)</li>

        <li>avgFuelConsumed - <em>(number)</em> Average Fuel Consumed by the asset</li>

        <li>cost - <em>(float)</em> Additional cost to be associated to the trip</li>

        <li>odometerStart - <em>(number)</em> Odometer reading at the beginning of trip</li>

        <li>odometerEnd - <em>(number)</em> Odometer reading at the end of trip</li>

        <li>co2 - <em>(number)</em> co2 emission details</li>

        <li>description - <em>(string)</em> Trip Description</li>

        <li>stopDuration - <em>(number)</em> Asset stop duration at the destination</li>

        <li>stopDescription - <em>(string)</em> Trip stop description</li>

        <li>stopType - <em>(string)</em> Trip stop type (C-Buisness/Classified,P-Personal,N-Non-Classified)</li>

        <li>jobStageId - <em>(string)</em> Unique Job Stage ID</li>

        <li>engineHourStart - <em>(number)</em> Engine hour/Runtime at the start of the trip</li>

        <li>engineHourEnd - <em>(number)</em> Engine hour/Runtime at the end of the trip</li>

        <li>engineHourUsed - <em>(number)</em> Engine hour/Runtime spent in the trip</li>

        <li>jobId - <em>(string)</em> Unique Job ID</li>

        <li>driverId - <em>(string)</em> Unique Driver ID</li>

        <li>totalDuration - <em>(number)</em> Total trip duration (in Seconds)</li>

        <li>movingDuration - <em>(number)</em> Trip asset moving time (in Seconds)</li>

        <li>idleDuration - <em>(number)</em> Trip asset idle time (in Seconds)</li>

        <li>stationaryDuration - <em>(number)</em> Trip asset stationary time (in Seconds)</li>

        </ul>

        <h2 id="custom-query-parameters">Custom Query Parameters</h2>

        <ul>

        <li>q - (string) - <em>Search assetId,imei,label,vehicleRegistration</em></li>

        <li>tagId - (string) - <em>Related Tag</em></li>

        <li>dateFrom - (datetime) - <em>Trip start date</em></li>

        <li>dateTo - (datetime) - <em>Trip end date</em></li>

        </ul>

        <h3 id="modifier-query-parameters">Modifier Query Parameters</h3>

        <p><strong>_fields</strong> : Avaliable Fields</p>

        <ul>

        <li>assetId,imei</li>

        <li>label</li>

        <li>jobId</li>

        <li>vehicleRegitration</li>

        <li>vehicleMake</li>

        <li>vehicleModel</li>

        <li>vehicleVin</li>

        <li>groupId</li>

        <li>tagId</li>

        <li>stopType</li>

        <li>dateFrom</li>

        <li>dateTo</li>

        <li>accountId,customerId</li>

        <li>dateInstalled</li>

        </ul>

        <p><strong>_extend</strong> : Available Extentions</p>

        <ul>

        <li>asset</li>

        <li>customer</li>

        <li>trip/address</li>

        <li>trip/driver</li>

        <li>trip/events</li>

        <li>trip/parameters</li>

        </ul>

        <p><strong>_sort</strong> : Available sort fields</p>

        <ul>

        <li>label</li>

        <li>dateFrom</li>

        <li>dateTo</li>

        <li>tripDistance</li>

        <li>avgSpeed</li>

        <li>maxSpeed</li>

        <li>stopDuration</li>

        </ul>

        '
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                label:
                  type: string
                command:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                total: 999999
                start: 1
                end: 200
                results:
                - tripId: 0
                  tripStatusId: 0
                  tripStateId: 0
                  tripDistance: null
                  dateFrom: '0000-00-00T00:00:00+00:00'
                  maxSpeed: null
                  avgSpeed: null
                  imei: 012345678901234567
                  startEventId: 0
                  endEventId: null
                  type: ''
                  fuelConsumed: null
                  avgFuelConsumed: null
                  odometerStart: 0
                  odometerEnd: 0
                  co2: null
                  stopDuration: null
                  stopType: U
                  jobStageId: null
                  engineHourStart: null
                  engineHourEnd: null
                  engineHourUsed: null
                  driverId: null
                  totalDuration: null
                  movingDuration: null
                  idleDuration: null
                  stationaryDuration: null
                  id: 0
                  tripDuration: 0
                params:
                  customerId: 0
                  groupId: []
                  _limit: 200
                  total: 999999
