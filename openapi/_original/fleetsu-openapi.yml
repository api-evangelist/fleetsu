  /v1/assets:
    get:
      operationId: getV1Assets
      summary: v1/assets
      tags:
      - Assets
      description: '<p>Return a list of assets</p>

        <h1 id="fields">Fields</h1>

        <div class="click-to-expand-wrapper is-table-wrapper"><table>

        <thead>

        <tr>

        <th>Field</th>

        <th>Type</th>

        <th>Description</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>deviceId/assetId</td>

        <td>string</td>

        <td>System defined unique identifier in the system for the asset, often expressed as a <a href="https://en.wikipedia.org/wiki/Universally_unique_identifier">UUID</a></td>

        </tr>

        <tr>

        <td>enabled</td>

        <td>integer</td>

        <td>An Integer indicating the current asset state 0 = Enabled, 4 = Paused</td>

        </tr>

        <tr>

        <td>label</td>

        <td>string</td>

        <td>Label used to identify an asset in the system</td>

        </tr>

        <tr>

        <td>accountId</td>

        <td>integer</td>

        <td>Integer Identifying the account where the asset is assigned</td>

        </tr>

        <tr>

        <td>groupId</td>

        <td>integer</td>

        <td>Integer Identifying the group where the asset is assigned</td>

        </tr>

        <tr>

        <td>dateActivated</td>

        <td>datetime</td>

        <td>UTC Datetime when the asset TODO</td>

        </tr>

        <tr>

        <td>vehicleMake</td>

        <td>string</td>

        <td>The Maker/Manufacturer of the asset</td>

        </tr>

        <tr>

        <td>vehicleModel</td>

        <td>string</td>

        <td>The Model of the asset</td>

        </tr>

        <tr>

        <td>vehicleRegistration</td>

        <td>string</td>

        <td>The Rego/Registration of the asset</td>

        </tr>

        <tr>

        <td>vehicleVin</td>

        <td>string</td>

        <td>The Vehicle Identification Number (VIN) a unique serial number used by the automative industry to identify individual
        vehicles</td>

        </tr>

        <tr>

        <td>maker</td>

        <td>string</td>

        <td>The Maker/Manufacturer of the Device used to capture Events and transmit to the platform</td>

        </tr>

        <tr>

        <td>model</td>

        <td>string</td>

        <td>The Model of the Device used to capture Events and transmit to the platform</td>

        </tr>

        <tr>

        <td>dateProvisioned</td>

        <td>datetime</td>

        <td>UTC Datetime when the asset TODO</td>

        </tr>

        <tr>

        <td>subscription</td>

        <td>string</td>

        <td>Description</td>

        </tr>

        <tr>

        <td>tripMethod</td>

        <td>string</td>

        <td>Description</td>

        </tr>

        <tr>

        <td>dateInstalled</td>

        <td>datetime</td>

        <td>UTC Datetime when the asset TODO</td>

        </tr>

        <tr>

        <td>allowApiEvents</td>

        <td>boolean</td>

        <td>Description</td>

        </tr>

        <tr>

        <td>fuelTankSize</td>

        <td>integer</td>

        <td>Description</td>

        </tr>

        <tr>

        <td>fuelTankFullPercentage</td>

        <td>integer</td>

        <td>Description</td>

        </tr>

        <tr>

        <td>driverId</td>

        <td>integer</td>

        <td>Description</td>

        </tr>

        <tr>

        <td>driverIdMethod</td>

        <td>string</td>

        <td>Description</td>

        </tr>

        <tr>

        <td>entityTypeKey</td>

        <td>string</td>

        <td>Description</td>

        </tr>

        <tr>

        <td>isDriverLocked</td>

        <td>boolean</td>

        <td>Description</td>

        </tr>

        <tr>

        <td></td>

        <td>string</td>

        <td>Description</td>

        </tr>

        <tr>

        <td>odometerLocked</td>

        <td>boolean</td>

        <td>Description</td>

        </tr>

        <tr>

        <td>runtimeLocked</td>

        <td>boolean</td>

        <td>Description</td>

        </tr>

        </tbody>

        </table>

        </div><h2 id="custom-query-parameters">Custom Query Parameters</h2>

        <ul>

        <li>q - (string) - <em>Search assetId,imei,label,vehicleRegistration</em></li>

        <li>tagId - (string) - <em>Related Tag</em></li>

        <li>deviceHealthId - (string) - <em>Device Health ID</em></li>

        <li>assetStateId - (string) - <em>Asset State ID</em></li>

        </ul>

        <h3 id="modifier-query-parameters">Modifier Query Parameters</h3>

        <p><strong>_fields</strong> : Avaliable Fields</p>

        <ul>

        <li>assetId,imei</li>

        <li>label</li>

        <li>jobId</li>

        <li>type</li>

        <li>vehicleRegitration</li>

        <li>vehicleMake</li>

        <li>vehicleModel</li>

        <li>vehicleVin</li>

        <li>avatar</li>

        <li>mapIconId</li>

        <li>groupId </li>

        <li>accountId,customerId</li>

        <li>dateInstalled</li>

        </ul>

        <p><strong>_extend</strong> : Available Extentions</p>

        <ul>

        <li>event - Last Event <em>last valid location received</em></li>

        <li>ping  - Last Ping <em>last time device communicated with platform</em></li>

        <li>movement - Last Movement <em>last time asset moved</em></li>

        <li>account - Account <em>assocated account</em></li>

        <li>group - Group <em>associated asset group</em></li>

        <li>asset/odo - ODO Reading <em>current odometer reading</em></li>

        <li>asset/tags - Tags <em>associated tags</em></li>

        <li>asset/state - Asset State <em>moving, parked, towing, review,investigate</em></li>

        <li>asset/setting - Custom Setting <em>custom asset settings e.g. fuel type</em></li>

        <li>asset/reminders - Service Reminders <em>pending service reminders</em></li>

        <li>asset/fields - Custom Fields</li>

        </ul>

        <p><strong>_sort</strong> : Available sort fields</p>

        <ul>

        <li>imei</li>

        <li>label</li>

        <li>vehicleRegistration</li>

        <li>vehicleMake</li>

        <li>vehicleModel</li>

        </ul>

        '
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                total: 20
                start: 1
                end: 1
                results:
                - deviceId: '12345678901234567'
                  type: phone
                  enabled: 0
                  label: Asset 1
                  accountId: 4
                  userId: 1344
                  groupId: 227
                  avatar: //cdn.fleetsu.com/avatar.png
                  authcode: 0
                  maker: fleetsu
                  model: app
                  dateProvisioned: '2019-01-01T00:00:00+00:00'
                  fbtEnabled: false
                  mapIconId: 24
                  dateInstalled: 2019-01-021T00:00:00+00:00
                  allowApiEvents: true
                  fuelTankSize: 55
                  fuelTankFullPercentage: 99
                  driverId: 0
                  installerId: 0
                  simDataLimit: 0
                  assetId: '12345678901234567'
                  odometerLocked: false
                  runtimeLocked: false
                params: {}
    post:
      operationId: postV1Assets
      summary: v1/assets
      tags:
      - Assets
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                label:
                  type: string
                groupId:
                  type: string
                entityTypeKey:
                  type: string
      responses:
        default:
          description: Response not documented in the collection
