  /v1/events:
    get:
      operationId: getV1Events
      summary: v1/events
      tags:
      - Events
      description: '<p>List of Events</p>

        <h3 id="fields">Fields</h3>

        <ul>

        <li>eventId - <em>(int)</em> - Event ID</li>

        <li>imei - <em>(string)</em> - Unique Asset ID</li>

        <li>label - <em>(string)</em> - Asset label</li>

        <li>latitude - <em>(Float)</em> - Asset location''s latitude</li>

        <li>longitude - <em>(Float)</em> - Asset location''s longitude</li>

        <li>formattedAddress - <em>(String)</em> - Asset location''s Full Address</li>

        <li>gpsIndicator - <em>(String)</em> - Device''s GPS Indicator</li>

        <li>numSatellites - <em>(int)</em> - Device''s total number of satellites</li>

        <li>heading - <em>(int)</em> - Device''s Heading</li>

        <li>speed - <em>(int)</em> - Asset Speed</li>

        <li>datetime - <em>(datetime)</em> - Event occurred Datetime</li>

        </ul>

        <h2 id="custom-query-parameters">Custom Query Parameters</h2>

        <ul>

        <li>q - (string) - <em>Search assetId,imei,label,vehicleRegistration</em></li>

        <li>imei - (string) - <em>Device''s IMEI</em></li>

        <li>tagId - (string) - <em>Related Tag</em></li>

        <li>customerId - (int) - <em>Customer ID</em></li>

        <li>groupId - (int) - <em>Group ID</em></li>

        </ul>

        <h3 id="modifier-query-parameters">Modifier Query Parameters</h3>

        <p><strong>_fields</strong> : Avaliable Fields</p>

        <ul>

        <li>eventId</li>

        <li>imei</li>

        <li>label</li>

        <li>latitude</li>

        <li>longitude</li>

        <li>formattedAddress</li>

        <li>gpsIndicator</li>

        <li>numSatellite</li>

        <li>heading</li>

        <li>speed</li>

        <li>datetime</li>

        </ul>

        <p><strong>_extend</strong> : Available Extentions</p>

        <ul>

        <li>event/address - Event''s full address</li>

        <li>device - Device Details</li>

        <li>event/extendedinfo - Event''s extended info details</li>

        <li>account - Account Details</li>

        <li>event/fence - Fence Details</li>

        <li>trip - Trip Details</li>

        </ul>

        <p><strong>_sort</strong> : Available sort fields</p>

        <ul>

        <li>datetime</li>

        <li>imei</li>

        </ul>

        '
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                results:
                - eventId: 1666111905
                  datetime: '2022-01-04T05:50:54+00:00'
                  code: '33'
