  /v1/accounts:
    get:
      operationId: getV1Accounts
      summary: accounts
      tags:
      - Accounts
      description: '<p>Return a list of Accounts</p>

        <h3 id="fields">Fields</h3>

        <div class="click-to-expand-wrapper is-table-wrapper"><table>

        <thead>

        <tr>

        <th><strong>Field</strong></th>

        <th><strong>Type</strong></th>

        <th><strong>Description</strong></th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>customerId</td>

        <td>int</td>

        <td>Unique Customer ID</td>

        </tr>

        <tr>

        <td>customerName</td>

        <td>string</td>

        <td>Customer Name</td>

        </tr>

        <tr>

        <td>firstName</td>

        <td>string</td>

        <td>Customer''s First Name</td>

        </tr>

        <tr>

        <td>lastName</td>

        <td>string</td>

        <td>Customer''s last Name</td>

        </tr>

        <tr>

        <td>accountType</td>

        <td>string</td>

        <td>Customer''s Account Type</td>

        </tr>

        <tr>

        <td>location</td>

        <td>string</td>

        <td>Customer''s Location</td>

        </tr>

        <tr>

        <td>address</td>

        <td>string</td>

        <td>Customer''s Address</td>

        </tr>

        <tr>

        <td>city</td>

        <td>string</td>

        <td>Customer''s City</td>

        </tr>

        <tr>

        <td>state</td>

        <td>string</td>

        <td>Customer''s State</td>

        </tr>

        <tr>

        <td>postcode</td>

        <td>string</td>

        <td>Customer''s PostCode</td>

        </tr>

        <tr>

        <td>country</td>

        <td>string</td>

        <td>Customer''s Country</td>

        </tr>

        <tr>

        <td>email</td>

        <td>string</td>

        <td>Customer''s Email</td>

        </tr>

        <tr>

        <td>dateAdded</td>

        <td>datetime</td>

        <td>Customer Added Date time</td>

        </tr>

        <tr>

        <td>subscriptionStartDate</td>

        <td>datetime</td>

        <td>Subscription Start Date time</td>

        </tr>

        <tr>

        <td>subscriptionRenewalDate</td>

        <td>datetime</td>

        <td>Subscription Renweal Date time</td>

        </tr>

        <tr>

        <td>subscriptionDuration</td>

        <td>datetime</td>

        <td>Subscription Duration Date time</td>

        </tr>

        </tbody>

        </table>

        </div><h2 id="custom-query-parameters">Custom Query Parameters</h2>

        <ul>

        <li>q - (string) - <em>Search customerName</em></li>

        </ul>

        <h3 id="modifier-query-parameters">Modifier Query Parameters</h3>

        <p><strong>_fields</strong> : Avaliable Fields</p>

        <ul>

        <li>customerId</li>

        <li>customerName</li>

        <li>firstName</li>

        <li>lastName</li>

        <li>accountType</li>

        <li>location</li>

        <li>address</li>

        <li>city</li>

        <li>state</li>

        <li>postcode</li>

        <li>country</li>

        <li>email</li>

        <li>dateAdded</li>

        <li>subscriptionStartDate</li>

        <li>subscriptionRenewalDate</li>

        <li>subscriptionDuration</li>

        </ul>

        <p><strong>_extend</strong> : Available Extentions</p>

        <ul>

        <li>account/users - Users <em>assocated users</em></li>

        <li>account/groups - Groups <em>assocated groups</em></li>

        <li>account/devicecount - Device Count <em>customer''s device count</em></li>

        <li>account/usercount - User Count <em>customer''s user count</em></li>

        <li>account/device/category/totals - Device Counts Grouped by Category</li>

        <li>account/device/subscription/category/totals - Device Subscription Totals Grouped by Category</li>

        <li>account/subscription/category/totals - Account Subscription Plans Grouped by Category</li>

        </ul>

        <p><strong>_sort</strong> : Available sort fields</p>

        <ul>

        <li>customerName</li>

        <li>firstName</li>

        <li>lastName</li>

        </ul>

        '
      responses:
