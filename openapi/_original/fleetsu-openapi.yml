  /v1/accounts/{accountId}/integrations:
    get:
      operationId: getV1AccountsByAccountidIntegrations
      summary: v1/accounts/(\d+)/integrations
      tags:
      - Accounts
      description: '<h3 id="accounts-integrations-module">Accounts Integrations Module</h3>

        <h4 id="accountintegrationkey">accountIntegrationKey</h4>

        <p>accountIntegrationKey Readonly string, Unique Id</p>

        <p>Unique string for the integration record</p>

        <hr />

        <h4 id="username">userName</h4>

        <p>userName Required string, max 100 chars</p>

        <p>External API Integration user name for basic auth</p>

        <hr />

        <h4 id="password">Password</h4>

        <p>password Required string, max 100 chars</p>

        <p>External API Integration password for basic auth</p>

        <hr />

        <h4 id="status">Status</h4>

        <p>status Required, boolean</p>

        <p>Status 1= Active, 0 = Disabled</p>

        <hr />

        <p><strong>type</strong> Required string, max 50 chars</p>

        <p>Integration provider type eg: fleetcam</p>

        <hr />

        <p><strong>data</strong> Optional array, max 20 chars</p>

        <p>Array of extended information/fields</p>

        <p>For type = fleetcam</p>

        <ul>

        <li>data[''group_id''] value is required. This group is used for auto provisioning the new devices</li>

        </ul>

        <hr />

        '
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      responses:
        default:
          description: Response not documented in the collection
  /v1/accounts/{accountId}/integrations/{accountIntegrationkey}:
    post:
      operationId: postV1AccountsByAccountidIntegrationsByAccountintegrationkey
      summary: v1/accounts/(\d+)/integrations/{accountIntegrationkey}
      tags:
      - Accounts
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      - name: accountIntegrationkey
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
