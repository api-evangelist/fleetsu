  /v1/users:
    get:
      operationId: getV1Users
      summary: v1/users
      tags:
      - Users
      description: '<p>Return a list of available users associated with current user account and sub accounts.</p>

        <h3 id="fields">Fields</h3>

        <ul>

        <li>userId - <em>(string)</em> - Unique User ID</li>

        <li>email - <em>(string)</em> - User''s Email address</li>

        <li>active - <em>(bool)</em> - User''s Status (Enabled/Disabled)</li>

        <li>roleId - <em>(string)</em> - User''s Type</li>

        <li>accountId - <em>(string)</em> - User Account</li>

        <li>driverToken - <em>(string)</em> - User with a driver Token is a driver</li>

        <li>firstName - <em>(string)</em> - User''s First name</li>

        <li>lastName - <em>(string)</em> - User''s Last Name</li>

        <li>mobile - <em>(string)</em> - User''s Mobile Number</li>

        <li>dateCreated - <em>(datetime)</em> - Date user is created</li>

        <li>fbtActive - <em>(bool)</em> - FBT user or not</li>

        <li>avatar - <em>(string)</em> - User''s avatar URI</li>

        <li>landingPage - <em>(string)</em> - User''s Landing page</li>

        </ul>

        <h2 id="custom-query-parameters">Custom Query Parameters</h2>

        <ul>

        <li>q - (string) - *Search firstname,lastname,email</li>

        <li>tagId - (string) - <em>Related Tag</em></li>

        <li>status - (int) - <em>User''s status (0/1)</em></li>

        <li>mobile_number - (string) - <em>User''s mobile number</em></li>

        </ul>

        <h3 id="modifier-query-parameters">Modifier Query Parameters</h3>

        <p><strong>_fields</strong> : Available Fields</p>

        <ul>

        <li>userId</li>

        <li>email</li>

        <li>active</li>

        <li>type</li>

        <li>customerId</li>

        <li>firstName</li>

        <li>lastName</li>

        </ul>

        <p><strong>_extend</strong> : Available Extensions</p>

        <ul>

        <li>user/preferences - Preferences <em>User''s Preferences</em></li>

        <li>user/devices - Devices <em>User''s Devices</em></li>

        <li>features  - Features <em>User privileges</em></li>

        <li>customer - Account  <em>Associated user account</em></li>

        <li>group - Group <em>Associated user group</em></li>

        <li>user/lastlogin - Last login <em>User''s last login details</em></li>

        <li>user/role - Role <em>User''s role in the system e.g.:sysadmin, user, manager etc</em></li>

        <li>user/tags - Tags <em>ssociated tags</em></li>

        <li>user/termsandconditions - Terms and conditions <em>TnC acceptance details including version and date</em></li>

        <li>user/trips - Trips * Driver/User trips *</li>

        </ul>

        <p><strong>_sort</strong> : Available sort fields</p>

        <ul>

        <li>active</li>

        <li>firstName</li>

        <li>lastName</li>

        </ul>

        '
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                total: 1
                start: 1
                end: 1
                results:
                - userId: 0
                  email: ''
                  active: true
                  roleId: ''
                  accountId: 0
                  firstName: ''
                  lastName: ''
                  dateCreated: ''
                  fbtActive: false
                  dashboard: ''
                  landingPage: ''
                  isAccountHolder: false
                  tags:
                  - tagId: '1'
                    accountId: 0
                    tagName: Tag name
                    tagBgColor: 2196f3
                    status: true
                    dateCreated: '0000-00-00T00:00:00+00:00'
                    tagType: TRACKER
                    userId: 0
                params:
                  accountId: 0
                  groupId: 0
    post:
      operationId: postV1Users
      summary: v1/users
      tags:
      - Users
      description: '<p>Create User</p>

        '
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
