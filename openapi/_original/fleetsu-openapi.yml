openapi: 3.0.3
info:
  title: Fleetsu - API
  version: 1.0.0
  description: "<html><head></head><body><p>Platform API Documentation</p>\n<p>The Fleetsu API is organised around <a href=\"\
    https://en.wikipedia.org/wiki/Representational_state_transfer\">REST</a>.   Our REST URls return <a href=\"https://www.json.org/json-en.html\"\
    >JSON-encoded</a> responses.  Standard HTTP Response codes are returned on all requests. \nEnsure a Header Value Key =\
    \ \"Accept\"  Value = \"application/json\"</p>\n<p>All API Requests must be made over <a href=\"https://en.wikipedia.org/wiki/HTTPS\"\
    >HTTPS</a></p>\n<h1 id=\"authentication\">Authentication</h1>\n<p>The Fleetsu API uses <a href=\"https://en.wikipedia.org/wiki/Basic_access_authentication\"\
    >HTTP Basic Authentication</a> use your Fleetsu username and password to authenticate.  </p>\n<p>Unauthenticated requests\
    \ will fail with a <a href=\"https://en.wikipedia.org/wiki/List_of_HTTP_status_codes#4xx_client_errors\">401 Unauthorized</a>\
    \ HTTP Response</p>\n<h3 id=\"basic-authentication\">Basic Authentication</h3>\n<p>Using standard basic http authentication\
    \ headers,using a user's login credentials e.g.</p>\n<p>Authorization: Basic OgXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX==</p>\n\
    <h1 id=\"filteringsearching\">Filtering/Searching</h1>\n<h3 id=\"string-fields\">String Fields</h3>\n<p><strong>Examples</strong></p>\n\
    <ul>\n<li>?label=Asset123 <em>Specific Search</em></li>\n<li>?label=Asset* <em>Wildcard Search</em></li>\n<li>?label=*123\
    \ <em>Wildcard Search</em></li>\n<li>?label=Asset123,Asset456 <em>Multivalue OR search</em></li>\n</ul>\n<h3 id=\"integerfloat-fields\"\
    >Integer,Float Fields</h3>\n<p><strong>Examples</strong></p>\n<ul>\n<li>?groupId=12 <em>Specific Search</em></li>\n<li>?groupId=12,76,100\
    \ <em>Multivalue OR search</em></li>\n<li>?groupId[0]=12&amp;groupId[1]=76&amp;groupId[2]=100 <em>Multivalue OR search</em></li>\n\
    </ul>\n<h3 id=\"datetime-fields\">Datetime Fields</h3>\n<p>Datetime fields can be searched using most common formats including\
    \ relative, although it is recommended to use ISO 8601 standard dates.</p>\n<p>If a timezone is not specified in the date\
    \ string UTC will be assumed.</p>\n<p><strong>Examples</strong></p>\n<ul>\n<li>?datetime=&gt;2017-01-01T00:00:00Z</li>\n\
    <li>?datetime=&lt;2017-11-30T00:00:00+00:00</li>\n<li>?datetime=&gt;2017-11-14T00:00:00+08:00,&lt;2017-11-17T23:59:59+08:00</li>\n\
    <li>?datetime=-7 day</li>\n<li>?datetime=&gt;last monday midnight,&lt;today midnight</li>\n</ul>\n<h1 id=\"sorting\">Sorting</h1>\n\
    <p><strong>_sort</strong> - Sort Results Set by specifed field e.g.</p>\n<ul>\n<li>_sort=label - <em>Sort by label field\
    \ in ascending order</em></li>\n<li>_sort=!label - <em>Sort by label field in decending order</em></li>\n<li>_sort=make,model\
    \ - <em>Sort by Make and then Model in ascending order</em></li>\n</ul>\n<h1 id=\"pagination\">Pagination</h1>\n<p><strong>_limit</strong>\
    \ - Limit returned results Min: 1, Max: 1000, default: 200</p>\n<p><strong>_start</strong> - Start point for returning\
    \ results e.g. _start=201</p>\n<h1 id=\"extending-datasets\">Extending Datasets</h1>\n<p><strong>_extend</strong> - Append\
    \ related data to the search results e.g.</p>\n<ul>\n<li>_extend=event - <em>Single Extend</em></li>\n<li>_extend=event,account\
    \ - <em>Multiple Extends</em></li>\n</ul>\n<p><em><strong>Basic Extend</strong></em></p>\n<p>The returned fields in the\
    \ extended objects can also restricted to the fields you require e.g.</p>\n<ul>\n<li>_extend=event:eventId|latitude|longitude|heading|speed|datetime</li>\n\
    </ul>\n<p><em><strong>Advanced Extend</strong></em></p>\n<ul>\n<li>_extend[event][_fields]=eventId|latitude|longitude|heading|speed|datetime</li>\n\
    <li>_extend[event][datetime]=&gt;2018-06-01,&lt;2018-06-30</li>\n<li>_extend[event][code]=144</li>\n<li>_extend[event][_sort]=datetime</li>\n\
    </ul>\n<h1 id=\"grouping\">Grouping</h1>\n<p><strong>_group</strong> - Group Results By Field e.g.</p>\n<ul>\n<li>_group=datetime:hour\
    \ <em>Group By Hour</em></li>\n</ul>\n<p>Available Datetime field modifiers</p>\n<ul>\n<li>HOUR - <em>Hour of Day</em></li>\n\
    <li>DATE - <em>Day</em></li>\n<li>MONTH - <em>Month</em></li>\n<li>DAYOFMONTH - <em>Day of Month e.g. 1st of every month</em></li>\n\
    <li>DAYOFWEEK - <em>Day of the Week</em></li>\n<li>DAYOFYEAR - <em>Day of Year 1 to 365</em></li>\n<li>MINUTE - <em>Minute</em></li>\n\
    <li>WEEK - <em>Week of Year</em></li>\n<li>WEEKDAY</li>\n<li>WEEKOFYEAR</li>\n<li>YEAR</li>\n<li>YEARWEEK</li>\n<li>DATEHOUR</li>\n\
    </ul>\n</body></html>"
