  /v1/fences:
    get:
      operationId: getV1Fences
      summary: v1/fences
      tags:
      - Fences
      description: '<p>All GeoFences in WKT format</p>

        <h3 id="fields">Fields</h3>

        <ul>

        <li>fenceId - <em>(string)</em> Unique fence ID</li>

        <li>accountId - <em>(string)</em> Unique Customer/Account ID</li>

        <li>fenceType - <em>(string)</em> Fence type (GeoPolygon)</li>

        <li>fenceName - <em>(string)</em> Fence name</li>

        <li>shapePoints - <em>(geometry)</em> Fence geometry or shape details</li>

        <li>radius - <em>(int)</em> Fence radius</li>

        <li>status - <em>(int)</em> Fence status (0/1 - Disabled/Enabled)</li>

        <li>lineColor - <em>(string)</em> Color code used to draw the border lines of the fence</li>

        <li>fillColor - <em>(string)</em> Color code used to fill the fence</li>

        <li>lineOpacity - <em>(float)</em> Opacity of the fence border line</li>

        <li>fillOpacity - <em>(float)</em> Opacity of the fence area</li>

        <li>lineWidth - <em>(int)</em> Width of the fence border line</li>

        <li>description - <em>(string)</em> Fence Description</li>

        <li>groupId - <em>(int)</em> Fence''s Group ID</li>

        <li>tags - <em>(array)</em> List of tags associated with the fence3</li>

        <li>dateCreated - <em>(datetime)</em> Date Fence is created</li>

        <li>isReportingFence - <em>(bool)</em> Is the fence used for reporting</li>

        </ul>

        <h2 id="custom-query-parameters">Custom Query Parameters</h2>

        <ul>

        <li>tagId - (string) - <em>Related Tag</em></li>

        <li>CustomerId - (string) - <em>Customer ID</em></li>

        <li>status - (int) - <em>Fence Status</em></li>

        </ul>

        <h3 id="modifier-query-parameters">Modifier Query Parameters</h3>

        <p><strong>_fields</strong> : Avaliable Fields</p>

        <ul>

        <li>fenceId</li>

        <li>fenceType</li>

        <li>fenceName</li>

        <li>status</li>

        <li>groupId </li>

        <li>accountId,customerId</li>

        <li>dateCreated</li>

        </ul>

        <p><strong>_extend</strong> : Available Extentions</p>

        <ul>

        <li>device -Asset/Device <em>Entered/Exited the fence</em></li>

        <li>event  - Event <em>device communicated with platform for fence in/out</em></li>

        <li>account - Account <em>associated account</em></li>

        <li>group - Group <em>associated  group</em></li>

        <li>device/health - Device Health * device health while interaction with fence*</li>

        <li>fence/tags - Tags <em>associated tags</em></li>

        <li>fence/summary - Fence Asset Summary <em>Fence Asset interaction summary</em></li>

        </ul>

        <p><strong>_sort</strong> : Available sort fields</p>

        <ul>

        <li>fenceId</li>

        <li>fenceName</li>

        </ul>

        '
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                total: 1
                start: 1
                end: 1
                results:
                - fenceId: 0
                  accountId: 0
                  fenceType: ''
                  fenceName: ''
                  shapePoints: ''
                  radius: null
                  status: 1
                  lineColor: ''
                  fillColor: ''
                  lineOpacity: 0
                  fillOpacity: 0
                  lineWidth: 3
                  description: ''
                  groupId: 0
                  dateCreated: '0000-00-00T00:00:00+00:00'
                  isReportingFence: true
                params:
                  _limit: '200'
                  _sort: fenceName
                  customerId: 0
                  status: 1
                  total: 1
    post:
      operationId: postV1Fences
      summary: v1/fences
      tags:
      - Fences
      description: '<p>Create Geo Fence</p>

        '
      responses:
        default:
          description: Response not documented in the collection
