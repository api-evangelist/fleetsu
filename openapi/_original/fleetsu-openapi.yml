  /v1/reports/last-movements:
    get:
      operationId: getV1ReportsLastMovements
      summary: reports/last-movements
      tags:
      - Reports
      description: '<p>Assets Last Movements Report</p>

        <p>###Fields</p>

        <ul>

        <li>assetID,imei - <em>(string)</em> - Unique Asset ID</li>

        <li>label - <em>(string)</em> - Asset label</li>

        <li>jobId - <em>(string)</em> - External Job Reference No. (scheduled for v9.22)</li>

        <li>type - <em>(string)</em> - Asset Type</li>

        <li>vehicleRegitration - <em>(string)</em> - Vehicle Registration No</li>

        <li>vehicleMake - <em>(string)</em> - Vehicle Manufacturer</li>

        <li>vehicleModel - <em>(string)</em> - Vehicle Model</li>

        <li>vehicleVin - <em>(string)</em> - Vechicle VIN Number</li>

        <li>avatar - <em>(string)</em> - URL to Asset Avatar</li>

        <li>mapIconId - <em>(int)</em> - Map Icon Id</li>

        <li>groupId - <em>(int)</em> - Assigned Asset Group</li>

        <li>accountID,customerId - <em>(int)</em> - Asset Account</li>

        <li>dateInstalled - <em>(datetime)</em> - Date Tracker Device Installed</li>

        <li>dateLastPing - <em>(datetime)</em> - Last Ping <em>last time device communicated with platform</em></li>

        <li>dateLastMovement - <em>(datetime)</em> - Last Movement <em>last time asset moved</em></li>

        <li>dateLastEvent - <em>(datetime)</em> - Last Event <em>last valid location received</em></li>

        <li>daysSinceLastMovement - <em>(int)</em> - No. of days since last movement</li>

        <li>deviceHealthSort - <em>(int)</em> - Device Health Sort Number</li>

        </ul>

        <h2 id="custom-query-parameters">Custom Query Parameters</h2>

        <ul>

        <li>q - (string) - <em>Search assetId,imei,label,vehicleRegistration</em></li>

        <li>deviceHealthId - (string) - Device Health Status <em>(online,review,investigate,offline,not-monitored,not-deployed)</em></li>

        <li>tagId - (int) - <em>Search based on Tag Id</em></li>

        <li>lastMovementStatusId - (string) - Assets last movement''s status <em>(today,yesterday,+48hrs,not-deployed)</em></li>

        <li>daysSinceLastMovement - (int) - <em>No. of days since last movement</em></li>

        </ul>

        <h3 id="modifier-query-parameters">Modifier Query Parameters</h3>

        <p><strong>_fields</strong> : Avaliable Fields</p>

        <ul>

        <li>assetId,imei</li>

        <li>label</li>

        <li>jobId</li>

        <li>type</li>

        <li>vehicleRegitration</li>

        <li>vehicleMake</li>

        <li>vehicleModel</li>

        <li>vehicleVin</li>

        <li>avatar</li>

        <li>mapIconId</li>

        <li>groupId </li>

        <li>accountId,customerId</li>

        <li>dateInstalled</li>

        </ul>

        <p><strong>_extend</strong> : Available Extentionss</p>

        <ul>

        <li>event - Associated Event</li>

        <li>asset/group - Groups</li>

        <li>device/health - Device Health Details</li>

        <li>asset/tags - Associated Asset''s Tags</li>

        <li>customer - Customer Details</li>

        </ul>

        <p><strong>_sort</strong> : Available sort fields</p>

        <ul>

        <li>label</li>

        <li>vehicleRegistration</li>

        <li>deviceHealthSort</li>

        <li>dateLastPIng</li>

        <li>daysSinceLastMovement</li>

        <li>dateLastMovement</li>

        </ul>

        '
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                label:
                  type: string
                command:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                total: 1
                start: 1
                end: 2
                results:
                - imei: 012345678901234567
                  enabled: 0
                  label: ''
                  customerId: 4
                  userId: null
                  groupId: 228
                  avatar: ''
                  simSerial: ''
                  authcode: null
                  vehicleMake: ''
                  vehicleModel: ''
                  vehicleRegistration: ''
                  vehicleVin: ''
                  maker: ''
                  model: ''
                  dateProvisioned: 000-00-00T00:00:00+00:00
                  fbtEnabled: true
                  reminderUserId: null
                  mapIconId: 14
                  allowApiEvents: false
                  fuelSource: ''
                  odoSource: ''
                  driverId: null
                  dateLastMovement: 000-00-00T00:00:00+00:00
                  daysSinceLastMovement: 103
                  dateLastPing: 000-00-00T00:00:00+00:00
                  deviceHealthSort: 4
                  deviceId: 012345678901234567
                params:
                  customerId: 0
                  groupId: []
