  /v1/assets/{assetId}:
    get:
      operationId: getV1AssetsByAssetid
      summary: v1/assets/{id}
      tags:
      - Assets
      description: '<p>Load a Asset''s Details</p>

        <h3 id="fields">Fields</h3>

        <ul>

        <li>assetID,imei - <em>(string)</em> - Unique Asset ID</li>

        <li>enabled - <em>(bool)</em> - Asset Enabled/Disabled</li>

        <li>label - <em>(string)</em> - Asset label</li>

        <li>jobId - <em>(string)</em> - External Job Reference No. (scheduled for v9.22)</li>

        <li>type - <em>(string)</em> - Asset Type</li>

        <li>vehicleRegitration - <em>(string)</em> - Vehicle Registration No</li>

        <li>vehicleMake - <em>(string)</em> - Vehicle Manufacturer</li>

        <li>vehicleModel - <em>(string)</em> - Vehicle Model</li>

        <li>vehicleVin - <em>(string)</em> - Vechicle VIN Number</li>

        <li>avatar - <em>(string)</em> - URL to Asset Avatar</li>

        <li>mapIconId - <em>(int)</em> - Map Icon Id</li>

        <li>groupId - <em>(int)</em> - Assigned Asset Group</li>

        <li>accountID,customerId - <em>(int)</em> - Asset Account</li>

        <li>jobId - <em>(int)</em> - Job ID</li>

        <li>dateInstalled - <em>(datetime)</em> - Date Tracker Device Installed</li>

        <li>purchaseDate - <em>(datetime)</em> - Date Ass4t was Purchased</li>

        </ul>

        <h3 id="modifier-query-parameters">Modifier Query Parameters</h3>

        <p><strong>_fields</strong> : Avaliable Fields</p>

        <ul>

        <li>q - Generic Search of label,imei,assetId,simSerial,vehicleRegitration</li>

        <li>assetId,imei</li>

        <li>label</li>

        <li>jobId</li>

        <li>type</li>

        <li>vehicleRegitration</li>

        <li>vehicleMake</li>

        <li>vehicleModel</li>

        <li>vehicleVin</li>

        <li>avatar</li>

        <li>mapIconId</li>

        <li>groupId </li>

        <li>accountId,customerId</li>

        <li>dateInstalled</li>

        <li>enabled</li>

        <li>tagId - Filter by Tag</li>

        <li>fenceId - Filter By Assets Associtated to Fence</li>

        <li>inFenceId - Filter to Assets in fence/s by fenceId</li>

        <li>deviceHealthId - Filter By Device Health (online,review,investigate,offline,not-deployed,not-monitored)</li>

        <li>assetStateId - Filter By Asset State (moving,parked,review,investigate,offline)</li>

        <li>sensor - Filter to assets by sensor/s parameter</li>

        <li>dateFrom - Filter Assets with trips after</li>

        <li>dateTo - Filter Asset trips berfore</li>

        </ul>

        <p><strong>_extend</strong> : Available Extentions</p>

        <ul>

        <li>event - Last Event <em>last valid location received, see v1/event for additional extend options</em></li>

        <li>ping,device/ping  - Last Ping <em>last time device communicated with platform see v1/event for additional extend
        options</em></li>

        <li>movement,device/movement - Last Movement <em>last time asset moved see v1/event for additional extend options</em></li>

        <li>account - Account <em>assocated account</em></li>

        <li>group. device/group - Group <em>associated asset group</em></li>

        <li>asset/odo - ODO Reading <em>current odometer reading</em></li>

        <li>asset/tags - Tags <em>associated tags</em></li>

        <li>asset/state - Asset State <em>moving, parked, towing, review,investigate</em></li>

        <li>asset/setting - Custom Setting <em>custom asset settings e.g. fuel type</em></li>

        <li>asset/reminders - Service Reminders <em>pending service reminders</em></li>

        <li>device/enginhour - Asset Current Engine Hour</li>

        <li>device/extendedinfo - Current Extended Info/Sensor Values</li>

        <li>device/health - Current Device Health</li>

        <li></li>

        </ul>

        '
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                imei: '12345678901234567'
                phoneNo: ''
                type: ''
                enabled: false
                label: Asset 1
                customerId: 4
                userId: 0
                groupId: 228
                avatar: //cdn.fleetsu.com/53b8bc8722231.png
                simSerial: Virtual
                authcode: 0
                engineNo: ''
                engineCapacity: ''
                vehicleMake: Fiat
                vehicleModel: X1
                vehicleRegistration: ''
                vehicleVin: ''
                fuelCard: ''
                etag: ''
                subType: ''
                maker: ''
                model: ''
                version: ''
                dateProvisioned: '2019-01-01T00:00:00+00:00'
                subscription: ''
                fbtEnabled: true
                reminderUserId: 0
                master: ''
                tripMethod: ''
                battery: ''
                mapIconId: 12
                cloneTo: ''
                allowApiEvents: false
                deviceId: '12345678901234567'
    post:
      operationId: postV1AssetsByAssetid
      summary: v1/assets/{id}
      tags:
      - Assets
      description: '<p>Update Asset''s Details</p>

        <h3 id="fields">Fields</h3>

        <ul>

        <li>assetID,imei - <em>(string)</em> - Unique Asset ID</li>

        <li>enabled - <em>(bool)</em> - Asset Enabled/Disabled</li>

        <li>label - <em>(string)</em> - Asset label</li>

        <li>jobId - <em>(string)</em> - External Job Reference No. (scheduled for v9.22)</li>

        <li>type - <em>(string)</em> - Asset Type</li>

        <li>vehicleRegitration - <em>(string)</em> - Vehicle Registration No</li>

        <li>vehicleMake - <em>(string)</em> - Vehicle Manufacturer</li>

        <li>vehicleModel - <em>(string)</em> - Vehicle Model</li>

        <li>vehicleVin - <em>(string)</em> - Vechicle VIN Number</li>

        <li>avatar - <em>(string)</em> - URL to Asset Avatar</li>

        <li>mapIconId - <em>(int)</em> - Map Icon Id</li>

        <li>groupId - <em>(int)</em> - Assigned Asset Group</li>

        <li>accountID,customerId - <em>(int)</em> - Asset Account</li>

        <li>jobId - <em>(int)</em> - Job ID</li>

        <li>dateInstalled - <em>(datetime)</em> - Date Tracker Device Installed</li>

        <li>purchaseDate - <em>(datetime)</em> - Date Ass4t was Purchased</li>

