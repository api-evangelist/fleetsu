  /v1/reports/fleet/completed-trips:
    get:
      operationId: getV1ReportsFleetCompletedTrips
      summary: reports/fleet/completed-trips
      tags:
      - Reports
      description: 'Completed Trips Report


        ###Fields


        tripId - (string) Unique Trip ID


        tripDistance - (number) Distance travelled in the trip (in Metres)


        dateFrom - (datetime) Trip start date and time


        dateTo - (datetime) Trip end date and time


        maxSpeed - (number) Maximum speed travelled during the trip


        avgSpeed - (number) Average speed travelled during the trip


        imei - (string) Unique asset identifier


        startEventId - (string) Identifier of the event from which the trip began


        endEventId - (string) Identifier of the event till which the trip lasted


        type - (string) Trips type


        fuelConsumed - (number) Amount of fuel consumed during the trip(in Millilitres)


        avgFuelConsumed - (number) Average Fuel Consumed by the asset


        cost - (float) Additional cost to be associated to the trip


        odometerStart - (number) Odometer reading at the beginning of trip


        odometerEnd - (number) Odometer reading at the end of trip


        co2 - (number) co2 emission details


        description - (string) Trip Description


        stopDuration - (number) Asset stop duration at the destination


        stopDescription - (string) Trip stop description


        stopType - (string) Trip stop type (C-Buisness/Classified,P-Personal,N-Non-Classified)


        jobStageId - (string) Unique Job Stage ID


        engineHourStart - (number) Engine hour/Runtime at the start of the trip


        engineHourEnd - (number) Engine hour/Runtime at the end of the trip


        engineHourUsed - (number) Engine hour/Runtime spent in the trip


        jobId - (string) Unique Job ID


        driverId - (string) Unique Driver ID


        totalDuration - (number) Total trip duration (in Seconds)


        movingDuration - (number) Trip asset moving time (in Seconds)


        idleDuration - (number) Trip asset idle time (in Seconds)


        stationaryDuration - (number) Trip asset stationary time (in Seconds)


        Custom Query Parameters


        q - (string) - Search assetId,imei,label,vehicleRegistration


        tagId - (string) - Related Tag


        dateFrom - (datetime) - Trip start date


        dateTo - (datetime) - Trip end date


        Modifier Query Parameters


        _fields : Avaliable Fields


        assetId,imei


        label


        jobId


        vehicleRegitration


        vehicleMake


        vehicleModel


        vehicleVin


        groupId


        tagId


        stopType


        dateFrom


        dateTo


        accountId,customerId


        dateInstalled


        _extend : Available Extentions


        asset


        customer


        trip/address


        trip/driver


        trip/events


        trip/parameters


        _sort : Available sort fields


        label


        dateFrom


        dateTo


        tripDistance


        avgSpeed


        maxSpeed


        stopDuration'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                label:
                  type: string
                command:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                total: 999999
                start: 1
                end: 200
                results:
                - tripId: 0
                  tripStatusId: 0
                  tripStateId: 0
                  tripDistance: null
                  dateFrom: '0000-00-00T00:00:00+00:00'
                  maxSpeed: null
                  avgSpeed: null
                  imei: 012345678901234567
                  startEventId: 0
                  endEventId: null
                  type: ''
                  fuelConsumed: null
                  avgFuelConsumed: null
                  odometerStart: 0
                  odometerEnd: 0
                  co2: null
                  stopDuration: null
                  stopType: U
                  jobStageId: null
                  engineHourStart: null
                  engineHourEnd: null
                  engineHourUsed: null
                  driverId: null
                  totalDuration: null
                  movingDuration: null
                  idleDuration: null
                  stationaryDuration: null
                  id: 0
                  tripDuration: 0
                params:
                  customerId: 0
                  groupId: []
                  _limit: 200
                  total: 999999
