                  customerId: 4
                  userId: null
                  groupId: 228
                  avatar: ''
                  simSerial: ''
                  authcode: null
                  vehicleMake: ''
                  vehicleModel: ''
                  vehicleRegistration: ''
                  vehicleVin: ''
                  maker: ''
