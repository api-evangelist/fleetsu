  /v1/reports/last-movements:
    get:
      operationId: getV1ReportsLastMovements
      summary: reports/last-movements
      tags:
      - Reports
      description: 'Assets Last Movements Report


        ###Fields


        assetID,imei - (string) - Unique Asset ID


        label - (string) - Asset label


        jobId - (string) - External Job Reference No. (scheduled for v9.22)


        type - (string) - Asset Type


        vehicleRegitration - (string) - Vehicle Registration No


        vehicleMake - (string) - Vehicle Manufacturer


        vehicleModel - (string) - Vehicle Model


        vehicleVin - (string) - Vechicle VIN Number


        avatar - (string) - URL to Asset Avatar


        mapIconId - (int) - Map Icon Id


        groupId - (int) - Assigned Asset Group


        accountID,customerId - (int) - Asset Account


        dateInstalled - (datetime) - Date Tracker Device Installed


        dateLastPing - (datetime) - Last Ping last time device communicated with platform


        dateLastMovement - (datetime) - Last Movement last time asset moved


        dateLastEvent - (datetime) - Last Event last valid location received


        daysSinceLastMovement - (int) - No. of days since last movement


        deviceHealthSort - (int) - Device Health Sort Number


        Custom Query Parameters


        q - (string) - Search assetId,imei,label,vehicleRegistration


        deviceHealthId - (string) - Device Health Status (online,review,investigate,offline,not-monitored,not-deployed)


        tagId - (int) - Search based on Tag Id


        lastMovementStatusId - (string) - Assets last movement''s status (today,yesterday,+48hrs,not-deployed)


        daysSinceLastMovement - (int) - No. of days since last movement


        Modifier Query Parameters


        _fields : Avaliable Fields


        assetId,imei


        label


        jobId


        type


        vehicleRegitration


        vehicleMake


        vehicleModel


        vehicleVin


        avatar


        mapIconId


        groupId


        accountId,customerId


        dateInstalled


        _extend : Available Extentionss


        event - Associated Event


        asset/group - Groups


        device/health - Device Health Details


        asset/tags - Associated Asset''s Tags


        customer - Customer Details


        _sort : Available sort fields


        label


        vehicleRegistration


        deviceHealthSort


        dateLastPIng


        daysSinceLastMovement


        dateLastMovement'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                label:
                  type: string
                command:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                total: 1
                start: 1
                end: 2
                results:
                - imei: 012345678901234567
                  enabled: 0
