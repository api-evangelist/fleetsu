    get:
      operationId: getV1AccountInvoices
      summary: account/invoices
      tags:
      - Accounts
      description: List of Enabled Features
      responses:
        default:
          description: Response not documented in the collection
  /v1/accounts:
    get:
      operationId: getV1Accounts
      summary: accounts
      tags:
      - Accounts
      description: 'Return a list of Accounts


        Fields


        Field

        Type

        Description


        customerId

        int

        Unique Customer ID


        customerName

        string

        Customer Name


        firstName

        string

        Customer''s First Name


        lastName

        string

        Customer''s last Name


        accountType

        string

        Customer''s Account Type


        location

        string

        Customer''s Location


        address

        string

        Customer''s Address


        city

        string

        Customer''s City


        state

        string

        Customer''s State


        postcode

        string

        Customer''s PostCode


        country

        string

        Customer''s Country


        email

        string

        Customer''s Email


        dateAdded

        datetime

        Customer Added Date time


        subscriptionStartDate

        datetime

        Subscription Start Date time


        subscriptionRenewalDate

        datetime

        Subscription Renweal Date time


        subscriptionDuration

        datetime

        Subscription Duration Date time


        Custom Query Parameters


        q - (string) - Search customerName


        Modifier Query Parameters


        _fields : Avaliable Fields


        customerId


        customerName


        firstName


        lastName


        accountType


        location


        address


        city


        state


        postcode


        country


        email


        dateAdded


        subscriptionStartDate


        subscriptionRenewalDate


        subscriptionDuration


        _extend : Available Extentions


        account/users - Users assocated users


        account/groups - Groups assocated groups


        account/devicecount - Device Count customer''s device count


        account/usercount - User Count customer''s user count


        account/device/category/totals - Device Counts Grouped by Category


        account/device/subscription/category/totals - Device Subscription Totals Grouped by Category


        account/subscription/category/totals - Account Subscription Plans Grouped by Category


        _sort : Available sort fields


        customerName


        firstName


        lastName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                total: 587
                start: 1
                end: 587
                results:
                - customerId: 4
                  parentId: 77
                  enabled: 1
                  customerName: Fleetsu Demo
                  address: 1 James Street
                  city: Perth
                  state: WA
                  postcode: '6000'
                  country: AU
                  dateAdded: '2016-04-11T06:04:21+00:00'
                  timezone: Australia/Perth
                  contactNumber1: '0400000000'
                  contactNumber2: '0400000000'
                  accountManager: John
                  subscriptionStartDate: '2015-05-04T00:00:00+00:00'
                  brandingDomain: app.fleetsu.com
                  billingType: contract
                  accountType: enterprise
                  accountId: 4
                  companyName: Fleetsu Demo
                  countryDefinition:
                    countryCode: AU
                    name: Australia
                    lat: -25.274398
                    lng: 133.775136
