    get:
      operationId: getV1AccountsByAccountidIntegrations
      summary: v1/accounts/(\d+)/integrations
      tags:
      - Accounts
      description: 'Accounts Integrations Module


        accountIntegrationKey


        accountIntegrationKey Readonly string, Unique Id


        Unique string for the integration record


        userName


        userName Required string, max 100 chars


        External API Integration user name for basic auth


        Password


        password Required string, max 100 chars


        External API Integration password for basic auth


        Status


        status Required, boolean


        Status 1= Active, 0 = Disabled


        type Required string, max 50 chars


        Integration provider type eg: fleetcam


        data Optional array, max 20 chars


        Array of extended information/fields


        For type = fleetcam


        data[''group_id''] value is required. This group is used for auto provisioning the new devices'
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      responses:
        default:
          description: Response not documented in the collection
