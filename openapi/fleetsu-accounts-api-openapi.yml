      description: Request Access Token for a Invite Code
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        default:
          description: Valid Code
          content:
            application/json:
              example:
                token: '1234567890123567890123456789012345678901235678901234567890'
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                code: 400
                message: Invalid Invite Code ID
        '404':
          description: Not Found
          content:
            application/json:
              example:
                code: 4040003
                message: Invite Not Found
