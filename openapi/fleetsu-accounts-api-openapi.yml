                customerId: 10
                customerName: Fleetsu
                parentId: 2
                accountId: 10
                companyName: Fleetsu
                groups:
                - groupId: 11
                  parentId: 11
                  name: Child Group 1
                  accountId: 10
                  status: true
                  parent: true
                  assetCount: 41
                  userCount: 5
                  children:
                  - groupId: 1281
                    parentId: 1197
                    name: Grand Child group
                    accountId: 98
                    status: true
                    parent: false
                    assetCount: 2
                    children:
                    - groupId: 1297
                      parentId: 1281
                      name: AAA
                      accountId: 98
                      status: true
                      parent: false
                      assetCount: 3
                children:
                - customerId: 12
                  customerName: Account 2
                  parentId: 10
                  accountId: 12
                  companyName: Account 2
                  groups:
                  - groupId: 1160
                    parentId: 1160
                    name: New group 1
                    accountId: 12
                    status: true
                    parent: true
                    assetCount: 15
                - customerId: 13
                  customerName: Account 3
                  parentId: 10
                  accountId: 13
                  companyName: Account 3
                  groups:
                  - groupId: 1174
                    parentId: 1174
                    name: All Assets
                    accountId: 12
                    status: true
                    parent: true
                    userCount: 1
                    children:
                    - groupId: 1304
                      parentId: 1174
                      name: Test 1
                      accountId: 5003
                      status: true
                      parent: false
                  children:
                  - customerId: 14
                    customerName: Child Account 3
                    parentId: 5003
                    accountId: 14
                    companyName: Child Account 3
                    groups:
                    - groupId: 1272
                      parentId: 1272
                      name: All Assets
                      accountId: 14
                      status: true
                      parent: true
