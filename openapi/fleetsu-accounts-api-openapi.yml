            schema:
              type: object
              properties:
                billingType:
                  type: string
                customerName:
                  type: string
                phone:
                  type: string
                abn:
                  type: string
                timezone:
                  type: string
                address:
                  type: string
                suburb:
                  type: string
                state:
                  type: string
                postcode:
                  type: string
                country:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                mobile:
                  type: string
                email:
                  type: string
      responses:
        default:
          description: Response not documented in the collection
  /v1/accounts/invite/{code}:
