      parameters:
      - name: fenceTypeId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                fenceType:
                  type: string
                status:
                  type: string
      responses:
        default:
          description: Response not documented in the collection
    delete:
