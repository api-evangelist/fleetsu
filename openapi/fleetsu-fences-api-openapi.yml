          description: OK
          content:
            application/json:
              example:
                total: 1
                start: 1
                end: 1
                results:
                - fenceTypeId: ''
                  status: true
                  accountId: 0
                  dateCreated: '0000-00-00T00:00:00+00:00'
                  dateUpdated: '0000-00-00T00:00:00+00:00'
    post:
      operationId: postV1FencesTypes
      summary: v1/fences/types
      tags:
      - Fences
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                fenceType:
                  type: string
      responses:
        default:
          description: Response not documented in the collection
