aid: fleetsu

name: Fleetsu

description: 'Fleetsu is an Australian connected-fleet and GPS telematics platform offering real-time
  vehicle tracking, fuel management and fuel tax credit reporting, ATO-compliant automated logbooks,
  driver safety scoring, AI video dashcams, location alerts, asset tracking and service reminders for
  car, truck, trailer and plant fleets. Its fleetsu.com site is now branded Rand McNally ("Rand Platform",
  (c) 2025 Rand McNally) and its help center redirects to help.randmcnally.io. The Fleetsu Platform API,
  documented at api-docs.fleetsu.com, is a REST/JSON API over HTTPS using HTTP Basic authentication, covering
  assets, accounts, drivers, events, faults, fences, groups, logbooks, trips, reports and more.'

